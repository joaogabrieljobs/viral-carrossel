    <!-- Tailwind CDN removido: CSP bloqueia cdn.tailwindcss.com; a UI usa GLOBAL_STYLE. -->
    <!-- Analytics: Plausible (privacy-first, sem cookies, sem PII, sem consent banner) -->
    <script>
      // A página de recuperação não carrega analytics com o token na URL.
      if (window.location.pathname !== '/redefinir-senha') {
        var analytics = document.createElement('script');
        analytics.defer = true;
        analytics.dataset.domain = /(^|\.)viralcarrossel\.com\.br$/.test(window.location.hostname)
          ? 'viralcarrossel.com.br'
          : 'moont.ai';
        analytics.src = 'https://plausible.io/js/script.tagged-events.js';
        document.head.appendChild(analytics);
      }
    </script>
    <script>window.plausible = window.plausible || function(){(window.plausible.q=window.plausible.q||[]).push(arguments)}</script>
    <style>
      html, body, #root { height: 100%; margin: 0; padding: 0; background: #090a0f; color: #f3f0e7; }
      body {
        overscroll-behavior-y: contain;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-family: 'SF Pro Text', 'SF Pro Display', -apple-system, BlinkMacSystemFont, system-ui, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 17px;
        line-height: 1.47;
        letter-spacing: -0.011em;
      }
