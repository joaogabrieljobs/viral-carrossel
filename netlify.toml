# Netlify APOSENTADO (2026-08-07) — produção é a Vercel (DEC-A, docs/audit.md).
#
# Por quê: `api/` é convenção Vercel. No Netlify os endpoints `/api/stripe/*` e
# `/api/auth/*` caíam no fallback SPA e devolviam HTML, então o paywall abria e
# o checkout falhava — o link não vendia.
#
# Este site agora só redireciona (301) para a Vercel, preservando qualquer link
# já divulgado. Não há build: `publish` aponta para um diretório com um
# index.html mínimo, e a regra de redirect cobre tudo antes dele.
[build]
  publish = "netlify-redirect"
  command = "mkdir -p netlify-redirect && printf '<!doctype html><meta http-equiv=\"refresh\" content=\"0; url=https://viral-carrossel.vercel.app/\">' > netlify-redirect/index.html"

# Redireciona TUDO — inclusive /api/* — para a produção real.
[[redirects]]
  from = "/*"
  to = "https://viral-carrossel.vercel.app/:splat"
  status = 301
  force = true
